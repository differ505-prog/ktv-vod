<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
  <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg?v=3" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ec4899" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CouchMic" />
  <title>🎤 CouchMic — TV 播放端</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Socket.io Client (與後端 v4.7.x 對應) -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- qrcode.js (產生 QR Code) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    html, body {
      margin: 0;
      /* 讓網頁避開電視硬體的 Overscan 與 Safe Area */
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 0px);
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: 'PingFang TC', 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 待機畫面的背景漸層 (與手機端對齊:粉+紫 radial-gradient,待機時隱約可見) */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(236, 72, 153, 0.18), transparent 60%),
        radial-gradient(1000px 500px at 110% 10%, rgba(139, 92, 246, 0.14), transparent 60%),
        #05050a;
      z-index: -1;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }
    body.immersive::before { opacity: 0.3; }
    video {
      /* 完全依賴外層容器的空間，動態自適應 */
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background: transparent;
    }
    .glow-text {
      text-shadow: 0 0 12px rgba(236, 72, 153, 0.8), 0 0 4px rgba(0,0,0,0.9);
    }
    /* 玻璃感 panel (對齊手機端 .glass: 半透明白底 + blur) */
    .panel {
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.03));
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    /* 沉浸模式特別版 panel:更深的玻璃感,搭配光暈 */
    .panel-glow {
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 0 32px -8px rgba(236, 72, 153, 0.35);
      border: 1px solid rgba(236, 72, 153, 0.25);
    }
    /* 粉紫漸層按鈕 (對齊手機 .pink-btn + .purple-btn) */
    .pink-btn {
      background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
      box-shadow: 0 8px 24px -8px rgba(236, 72, 153, 0.6);
    }
    .pink-btn:hover { filter: brightness(1.12); }
    .pink-btn:active { transform: scale(0.96); }
    .purple-btn {
      background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
      box-shadow: 0 8px 24px -8px rgba(139, 92, 246, 0.6);
    }
    .purple-btn:hover { filter: brightness(1.12); }
    .purple-btn:active { transform: scale(0.96); }
    /* 待機 emoji 脈動光暈 */
    @keyframes glow-pulse {
      0%, 100% {
        text-shadow:
          0 0 20px rgba(236, 72, 153, 0.6),
          0 0 40px rgba(139, 92, 246, 0.4);
        transform: scale(1);
      }
      50% {
        text-shadow:
          0 0 32px rgba(236, 72, 153, 0.9),
          0 0 60px rgba(139, 92, 246, 0.6);
        transform: scale(1.06);
      }
    }
    .standby-emoji {
      animation: glow-pulse 3s ease-in-out infinite;
      display: inline-block;
    }
    /* 連線狀態指示燈改為粉紫漸層版 (對齊視覺) */
    .status-dot {
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.6);
    }
    /* 隱藏 video 預設控制項 */
    video::-webkit-media-controls { display: none !important; }
    video::-webkit-media-controls-enclosure { display: none !important; }

    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }
    .pulse-ring { animation: pulse-ring 2s ease-in-out infinite; }

    /* ===== UI 元素淡入淡出 (The Smart Fade) =====
       預設為可見 (opacity:1) — 這是「待機/待機 / 待機」狀態。
       JS 透過 .ui-faded class 觸發淡出。
       注意: 系統標題 (左上) 和 immersiveBtn (左下) 是「控制項」,
       從不淡出,保持可達性。 */
    #nowPlayingPanel,
    #qrPanel,
    #nowPlayingBar {
      transition: opacity 0.6s ease;
    }
    #nowPlayingPanel.ui-faded,
    #qrPanel.ui-faded,
    #nowPlayingBar.ui-faded {
      opacity: 0;
      pointer-events: none;
    }

    /* 沉浸模式 (immersive): 預設就全部隱藏。但有 CSS animation 「叫醒」時,
       JS 會用 .ui-shown 強制把元素縮回來 (opacity:1) —
       聲音設計: 沉浸模式是由 tv 端的「全螢幕」按鈕 / mobile 端「TV 全螢幕」觸發的,
       入場即表示「进入無干擾狀態」,所以預設 fade。
       但手機端「顯示 QR」依然要能叫醒 QR。 */
    body.immersive #nowPlayingPanel,
    body.immersive #qrPanel,
    body.immersive #nowPlayingBar {
      opacity: 0;
      pointer-events: none;
    }
    body.immersive #nowPlayingPanel.ui-shown,
    body.immersive #qrPanel.ui-shown,
    body.immersive #nowPlayingBar.ui-shown {
      opacity: 1;
      pointer-events: auto;
    }

    /* 沉浸模式:隱藏「全螢幕」按鈕 (沉浸時看不見也無需退出,手機遙控即可離開)
       + 縮小左上「CouchMic · 播放端」標題到角落 (hover/連線異常時仍可見) */
    #immersiveBtn,
    #systemTitle,
    #standbyScreen {
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    body.immersive #immersiveBtn {
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
    }
    body.immersive #systemTitle {
      opacity: 0.25;
      transform: scale(0.6);
      pointer-events: none;
    }
    /* 沉浸模式下也淡出待機畫面,讓純粹沉浸觀影 */
    body.immersive #standbyScreen {
      opacity: 0;
      pointer-events: none;
    }

    /* ===== 音樂模式 (Audio-Only Mode) =====
       隱藏 video 元素 (但繼續播 audio),改成黑底大字歌名畫面。
       適用於：手機 PWA 背景播放、純粹聽歌場景。 */
    body.audio-mode #player {
      display: none !important;
    }
    body.audio-mode #nowPlayingPanel,
    body.audio-mode #qrPanel,
    body.audio-mode #nextSongCard,
    body.audio-mode #standbyScreen,
    body.audio-mode #immersiveBtn,
    body.audio-mode #systemTitle {
      display: none !important;
    }
    /* 音樂模式下保留底部 bar,顯示大歌名 */
    body.audio-mode #nowPlayingBar {
      opacity: 1 !important;
      pointer-events: auto !important;
      max-width: 90vw;
      padding: 1.25rem 2rem;
    }
    body.audio-mode #nowPlayingBarTitle {
      font-size: 1.5rem;
    }
    body.audio-mode #transitionOverlay {
      opacity: 0 !important;
      pointer-events: none !important;
    }
    body.audio-mode #songAddedToast {
      /* toast 在音樂模式仍要保留通知用 */
      display: block !important;
    }

    /* 「已點播：xxx」toast (頂部中央) — 默認隐藏, 加上 .show 才顯示 */
    #songAddedToast {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
      z-index: 25;
    }
    #songAddedToast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body class="bg-black">

  <!-- 滿版播放器 -->
  <video id="player" playsinline preload="auto"></video>

  <!-- 換歌黑幕過場 -->
  <div id="transitionOverlay" class="fixed inset-0 bg-black z-40 opacity-0 pointer-events-none transition-opacity duration-300"></div>

  <!-- 右上角：當前播放資訊 -->
  <div id="nowPlayingPanel" class="fixed top-4 right-4 panel panel-glow rounded-2xl px-5 py-4 max-w-md">
    <div class="flex items-center gap-2 text-pink-400 text-xs font-bold tracking-widest mb-1">
      <i class="fa-solid fa-microphone-lines"></i>
      <span>目前播放</span>
    </div>
    <h2 id="nowPlayingTitle" class="text-xl font-bold truncate glow-text">等待點歌中...</h2>
    <div id="nowPlayingArtist" class="text-sm text-gray-300 truncate">—</div>
    <div id="nowPlayingMeta" class="text-xs text-gray-400 mt-1 flex items-center gap-3">
      <span><i class="fa-solid fa-music text-pink-400"></i> <span id="audioModeLabel">原唱</span></span>
      <span id="connectionStatus"><i class="fa-solid fa-circle text-green-400"></i> 已連線</span>
    </div>
  </div>

  <!-- 左上角：系統標題 (常駐, 不淡出) -->
  <div id="systemTitle" class="fixed top-4 left-4 panel rounded-xl px-4 py-2 flex items-center gap-3 z-10">
    <div class="pulse-ring w-2.5 h-2.5 rounded-full status-dot"></div>
    <span class="font-bold tracking-wider text-sm">
      <i class="fa-solid fa-tv text-pink-400"></i> CouchMic <span class="text-gray-400 font-normal">· 播放端</span>
    </span>
  </div>

  <!-- 右下角：QR Code (手機遙控) — 可由 mobile 請求叫醒 15 秒 -->
  <div id="qrPanel" class="fixed bottom-4 right-4 panel panel-glow rounded-2xl p-4">
    <div class="text-xs text-gray-300 mb-2 text-center font-medium">
      <i class="fa-solid fa-mobile-screen text-pink-400"></i> 掃描以遙控點歌
    </div>
    <div id="qrcode" class="bg-white p-2 rounded-xl shadow-lg"></div>
    <div id="qrUrl" class="text-[10px] text-gray-400 mt-2 text-center font-mono break-all"></div>
  </div>

  <!-- 沉浸模式時,底部中央保留「目前播放」bar -->
  <div id="nowPlayingBar" class="fixed bottom-8 left-1/2 -translate-x-1/2 panel panel-glow rounded-full px-8 py-3 max-w-2xl text-center">
    <div class="flex items-center gap-3 text-base">
      <i class="fa-solid fa-microphone-lines text-pink-400"></i>
      <span id="nowPlayingBarTitle" class="font-bold glow-text truncate">等待點歌中...</span>
      <span id="nowPlayingBarArtist" class="text-gray-300 text-sm"></span>
    </div>
  </div>

  <!-- 下一首倒數卡片 -->
  <div id="nextSongCard" class="fixed inset-0 z-30 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-500">
    <div class="panel panel-glow rounded-3xl px-8 py-6 text-center max-w-sm shadow-2xl">
      <div id="nextSongCountdownNum" class="text-6xl font-bold text-pink-400 glow-text mb-2">30</div>
      <div class="text-xs text-gray-400 uppercase tracking-widest mb-3">即將播放</div>
      <div id="nextSongCardTitle" class="text-xl font-bold glow-text truncate">—</div>
      <div id="nextSongCardArtist" class="text-sm text-gray-300 truncate">—</div>
    </div>
  </div>

  <!-- 歌單空了警告 bar -->
  <div id="queueEmptyBar" class="fixed bottom-0 left-0 right-0 z-20 bg-gradient-to-r from-pink-600 to-purple-600 text-white text-center py-2 text-sm font-medium tracking-wide opacity-0 transition-opacity duration-300 pointer-events-none">
    <i class="fa-solid fa-triangle-exclamation mr-2"></i>歌單空了，去點歌吧！
  </div>

  <!-- 「已點播：xxx」toast -->
  <div id="songAddedToast" class="panel panel-glow rounded-2xl px-6 py-3">
    <div class="flex items-center gap-3 text-base">
      <i class="fa-solid fa-circle-check text-green-400 text-xl"></i>
      <span class="text-gray-400 text-sm">已點播</span>
      <span id="songAddedToastTitle" class="font-bold glow-text">—</span>
    </div>
  </div>

  <!-- 中央 loading 提示 (待機畫面) -->
  <div id="standbyScreen" class="fixed inset-0 flex items-center justify-center pointer-events-none">
    <div class="text-center">
      <div class="text-7xl mb-6 standby-emoji">🎤</div>
      <h1 class="text-5xl font-bold glow-text mb-3">KTV 點歌系統</h1>
      <p class="text-pink-300 text-sm font-medium tracking-widest mb-4">POWERED BY COUCHMIC</p>
      <p class="text-gray-400 mt-2 text-lg">手機掃描右下角 QR Code 即可加入點歌行列</p>
    </div>
  </div>

  <!-- 左下角:全螢幕控制按鈕 (TV 端主動入口) -->
  <div class="fixed bottom-4 left-4 z-20 flex items-center gap-2">
    <button id="immersiveBtn" class="panel rounded-xl px-4 py-2.5 flex items-center gap-2 hover:bg-white/10 transition-all shadow-2xl">
      <i id="immersiveIcon" class="fa-solid fa-expand text-pink-400"></i>
      <span id="immersiveBtnLabel" class="text-sm font-medium">全螢幕</span>
    </button>
    <button id="audioModeBtn" class="panel rounded-xl px-4 py-2.5 flex items-center gap-2 hover:bg-white/10 transition-all shadow-2xl" title="切換音樂模式 (背景播放)">
      <i class="fa-solid fa-headphones text-pink-400"></i>
      <span id="audioModeBtnLabel" class="text-sm font-medium">音樂模式</span>
    </button>
  </div>

  <!-- Mobile 請求 dialog (瀏覽器要求 user gesture 才能進 fullscreen) -->
  <div id="immersiveDialog" class="hidden fixed inset-0 z-40 bg-black/70 backdrop-blur-md flex items-center justify-center">
    <div class="panel panel-glow rounded-3xl p-8 max-w-md text-center">
      <div class="text-6xl mb-4 standby-emoji">📺</div>
      <h2 class="text-2xl font-bold glow-text mb-3">CouchMic 全螢幕模式</h2>
      <p class="text-gray-300 text-sm leading-relaxed mb-6">
        瀏覽器需要你點一下按鈕才能進入全螢幕。<br/>
        按下方按鈕即可進入觀影模式。
      </p>
      <button id="immersiveDialogConfirm" class="px-8 py-3 pink-btn rounded-xl text-lg font-bold flex items-center gap-2 mx-auto transition-all">
        <i class="fa-solid fa-expand"></i>
        進入全螢幕
      </button>
      <button id="immersiveDialogCancel" class="block mx-auto mt-4 text-sm text-gray-400 hover:text-gray-200 transition-colors">
        取消
      </button>
    </div>
  </div>

  <!-- 首次播放解鎖 overlay (瀏覽器 autoplay policy) -->
  <div id="unlockOverlay" class="fixed inset-0 z-30 bg-black/80 flex items-center justify-center cursor-pointer backdrop-blur-md">
    <div class="text-center p-8 panel rounded-3xl max-w-lg">
      <div class="text-7xl mb-6 animate-bounce">🎬</div>
      <h2 class="text-3xl font-bold glow-text mb-3">點擊任意處開始</h2>
      <p class="text-gray-300 text-sm leading-relaxed">
        瀏覽器需要您點一下頁面，才能播放聲音。<br/>
        點完這訊息就會消失。
      </p>
      <div class="mt-6 text-pink-400 text-xs tracking-widest">
        <i class="fa-solid fa-hand-pointer"></i> TAP TO START
      </div>
    </div>
  </div>

  <script>
    // Cache-busting: 部署時間戳,讓 user 不必手動 Ctrl+Shift+R
    document.write(
      '<script src="./tv.js?v=' + Date.now() + '"><\/script>'
    );
  </script>
</body>
</html>
